name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: test

      - name: Install tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-tra

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/hks

      - name: HTTP entrypoint smoke
        run: |
          uv run hks-api --help >/dev/null
          uv run python -c "from hks.adapters.http_server import create_app; create_app()"

      - name: Test
        run: uv run pytest --ignore=tests/eval --cov=hks --cov-fail-under=80 -q

      - name: Golden retrieval quality gate
        run: uv run pytest tests/eval/test_golden_retrieval_quality.py -q

  airgapped-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: airgapped-install

      - name: Warm cache
        run: uv sync

      - name: Recreate venv from local cache only
        run: |
          rm -rf .venv
          uv sync --offline

      - name: Offline office ingest smoke
        run: uv run pytest tests/integration/test_office_pipeline.py -q
